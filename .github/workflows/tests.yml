name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php: '8.4'
          coverage: none
      - run: composer validate --strict
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['12.*', '13.*']
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '11.*'

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / ${{ matrix.stability }}

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: none
      - run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/phpunit

  databases:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: mysql
            port: 3306
            user: root
          - db: pgsql
            port: 5432
            user: postgres

    name: ${{ matrix.db }}

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: testing
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: testing
        ports: ['5432:5432']
        options: --health-cmd=pg_isready --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php: '8.4'
          extensions: pdo_mysql, pdo_pgsql
          coverage: none
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/phpunit
        env:
          DB_CONNECTION: ${{ matrix.db }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.port }}
          DB_DATABASE: testing
          DB_USERNAME: ${{ matrix.user }}
          DB_PASSWORD: secret
      - name: Benchmarks (query counts and exact results on a large dataset)
        run: php -d memory_limit=1G vendor/bin/phpunit --group performance
        env:
          PERF_RECORDS: 5000
          DB_CONNECTION: ${{ matrix.db }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.port }}
          DB_DATABASE: testing
          DB_USERNAME: ${{ matrix.user }}
          DB_PASSWORD: secret
